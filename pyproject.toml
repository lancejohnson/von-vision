[project]
name = "von-vision"
version = "0.1.0"
description = "Zero-shot Von-style typed visual decisions with SigLIP/SigLIP2."
authors = [{ name = "Victor Hugo" }, { name = "Von Vision contributors" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = ["pydantic>=2.0.0"]

[project.optional-dependencies]
# The retained upstream `von` package remains available for users that need it.
von = [
    "torch>=2.0.0",
    "transformers>=4.48.0",
    "accelerate>=0.26.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "click>=8.1.0",
    "httpx>=0.27.0",
]
vision = [
    "Pillow>=10.0.0",
    # Torch 2.2 is the last release with Intel macOS wheels. Transformers 5
    # requires Torch 2.5+, and Torch 2.2's NumPy bridge requires NumPy 1.x.
    "torch>=2.2.0,<2.3.0",
    "numpy>=1.26.0,<2.0.0",
    "transformers>=4.49.0,<5.0.0",
    "sentencepiece>=0.2.0",
    "protobuf>=5.0.0",
]
dev = [
    "Pillow>=10.0.0",
    "pytest>=8.0.0",
]

[project.scripts]
von-vision = "von_vision.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/von", "src/von_vision"]
